/* 游戏按钮视觉编号。尺寸可由所在面板覆盖，编号只决定交互语义与配色。 */
:where(.button-1,.button-2,.button-3,.button-4,.button-5,.button-6,.button-7,.button-8,.button-9){appearance:none;align-items:center;justify-content:center;gap:6px;border-radius:8px;font-size:12px;font-weight:900;line-height:1.2;cursor:pointer}
.button-1{border:1px solid var(--primary-button-border);background:var(--primary-button-background);color:#190f04;box-shadow:inset 0 1px 0 #fff5;border-radius:12px}
.button-2{border:1px solid #45413b;background:#303030;color:#f0e8d6;box-shadow:none}
.button-3{border:1px solid #d59a2b;background:#302b24;color:#fff3dd;box-shadow:none}
.button-4{border:1px solid var(--primary-button-border);background:var(--primary-button-background);color:#201508;box-shadow:inset 0 1px 0 #fff5;border-radius:12px}
.button-5{border:1px solid #dc7771;background:#742c30;color:#ffe4de;box-shadow:0 1px 6px #0008}
.button-6{border:1px solid #47403a;background:#242424;color:#f1e9dc;text-align:left}.button-6[aria-pressed="true"],.button-6.selected{border-color:#ffb226;box-shadow:inset 3px 0 #ffad13}
.button-7{border:1px solid #775527;background:#2e271e;color:#ffd072;box-shadow:none}
.button-8{display:grid;width:34px;height:34px;padding:0;border:1px solid #5d4a2c;background:#302b24;color:#f6c35b;font-size:22px;line-height:1;place-items:center}
.button-9{border:1px solid #6c5332;background:#292520;color:#c8b89e;box-shadow:none}.button-9[aria-selected="true"]{border-color:#ffac1c;background:#ffac1c;color:#201303}
.leaderboard-switch .button-9,.leaderboard-switch .button-9[aria-selected="true"]{border-color:transparent;background:transparent}
:where(.button-1,.button-2,.button-3,.button-4,.button-5,.button-6,.button-7,.button-8,.button-9):disabled{opacity:.48;cursor:not-allowed;box-shadow:none}
.ad-loading-icon{display:inline-block;flex:0 0 auto;width:22px;height:22px;border:3px solid #24170645;border-top-color:#241706;border-radius:50%;box-sizing:border-box;animation:ad-button-spin .75s linear infinite}

@media (prefers-reduced-motion:reduce){.ad-loading-icon{animation-duration:1.5s}}
button[data-network-pending] { cursor: wait; opacity: .75; }
button[data-network-pending]::after { content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 6px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: middle; animation: network-button-spin .7s linear infinite; }

#recruit.draft-style-material .ssr-card{
  position:relative;
  isolation:isolate;
  width:auto;
  min-width:0;
  min-height:0;
  aspect-ratio:auto;
  padding:0;
  border-color:#f2c85e;
  border-radius:8px;

  box-shadow:inset 0 2px 0 #fff3b8,inset 0 -1px 0 #9b6b14,0 4px 12px #0009;

#recruit.draft-style-material .ssr-card:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:none;
}

#recruit.draft-style-material .ssr-card .ssr-player-art{
  position:absolute;

  top:4px;
  right:-7px;
  bottom:0;
  width:57%;
  pointer-events:none;
  background-image:var(--ssr-player-art,none);
  background-repeat:no-repeat;
  background-position:right bottom;
  background-size:contain;
  filter:drop-shadow(0 2px 4px #60768f70);
  opacity:.9;
}
#recruit.draft-style-material .card.tier-legend.ssr-card .visual-number{z-index:2;right:6px;color:#9eb4c5;font-size:clamp(42px,13.5vw,59px);opacity:.9;text-shadow:0 1px 0 #fff,0 2px 7px #40566d99}

.hundred-card-status{font-size:8px;line-height:1.3;color:#b9e5b3;text-align:center;min-width:0}
.hundred-card.is-unselected .hundred-card-status{color:#aeb4bb}
.hundred-review-upgrade.is-two-column{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px}
.hundred-review-upgrade.is-two-column p{min-width:0;gap:6px}.hundred-review-upgrade.is-two-column p:last-child{border-bottom:1px solid #ffffff0b}
.hundred-card-status{white-space:nowrap}
.hundred-card.is-compact:not(.hundred-reveal) .hundred-card-top b,.hundred-card.is-compact:not(.hundred-reveal) .hundred-card-top strong{font-size:18px}
.hundred-card.is-compact:not(.hundred-reveal) .hundred-card-top strong{margin-right:24px}
.hundred-card.is-compact .hundred-card-status{font-size:7px}
.hundred-card.is-compact:not(.hundred-reveal) .hundred-card-top{gap:2px}
/* Share the player detail badge appearance, with card-specific sizing. */
.hundred-badges>.draft-skill-badge{margin:0;padding:2px 4px;border:1px solid color-mix(in srgb,var(--skill-color) 60%,transparent);border-radius:99px;background:color-mix(in srgb,var(--skill-color) 16%,#17151e);color:var(--skill-color);font-size:7px;line-height:1.2;gap:3px;max-width:100%}
.hundred-badges>.draft-skill-badge>span{padding:0;border:0;border-radius:0;background:none;color:var(--skill-color);font-size:inherit;line-height:inherit}
.hundred-badges>.draft-skill-badge>b{font-size:inherit;color:var(--skill-color);font-weight:800}
.hundred-animation .hundred-card{min-height:0}
.hundred-reveal .hundred-card-name{display:block}
.hundred-reveal .hundred-card-name h3{font-size:13px;margin:7px 0 6px}
.hundred-reveal .hundred-badges{margin-top:0}
.hundred-reveal .hundred-badges>.draft-skill-badge{font-size:9px;padding:3px 5px;gap:4px}
.hundred-reveal .hundred-badges>.draft-skill-badge>span{font-size:inherit}
.hundred-card-status{font-size:9px;font-weight:800}
.hundred-card.is-compact .hundred-card-status{font-size:7.5px}
.hundred-card.is-compact:not(.hundred-reveal) .hundred-card-top{gap:1px}
.hundred-card.is-compact:not(.hundred-reveal) .hundred-card-top strong{margin-right:22px}
.hundred-receipt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 14px}
.hundred-receipt p{font-size:11px;gap:6px;margin:2px 0;min-width:0}
.hundred-receipt b{display:inline-flex;align-items:center;gap:4px}
.hundred-cash-icon{width:13px;height:13px;object-fit:contain;flex:none}
#recruit.hundred-recruit-screen{--screen-bottom-gap:24px;padding-bottom:24px}
.hundred-heading>.hundred-reveal-status{font-size:9px;line-height:1.5;text-align:right;white-space:normal;max-width:58%}
.hundred-animation .hundred-card{padding:6px}
.hundred-reveal .hundred-card-name{margin:3px 0 0}
.hundred-reveal .hundred-card-name h3{margin:3px 0 4px;line-height:1.3}
.hundred-reveal .hundred-badges{gap:2px}
.hundred-reveal .hundred-badges>.draft-skill-badge{padding:2px 4px;gap:3px}
